name: APK Android

# - push su main: test + APK come artifact (per provare le ultime modifiche)
# - tag v* (es. v0.1.0): come sopra, in più crea una Release pubblica con l'APK allegato
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # L'SDK Android è già installato sulle macchine ubuntu-latest (ANDROID_HOME).
      # android-actions/setup-android@v3 fallisce con le cmdline-tools recenti (pacchetto "tools" sparito).

      - uses: gradle/actions/setup-gradle@v6

      - name: Installa dipendenze (dal package-lock)
        run: npm ci --no-audit --no-fund

      - name: Controlla le versioni rispetto all'SDK Expo
        run: npx expo install --check

      - name: Test (devono essere tutti verdi)
        run: npm test

      - name: Versione dell'app (dal tag, o -dev su main)
        run: npx tsx scripts/set-version.ts "$GITHUB_REF" "$GITHUB_RUN_NUMBER"

      - name: Genera il progetto Android
        run: npx expo prebuild --platform android --clean --no-install

      # Chiave di firma da GitHub Secrets. Senza (es. fork) la build esce firmata con la chiave di debug.
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.CONTROLLAMI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/controllami-release.keystore"
            echo "CONTROLLAMI_KEYSTORE=$RUNNER_TEMP/controllami-release.keystore" >> "$GITHUB_ENV"
            echo "Firma: chiave di release"
          else
            echo "::warning::Nessuna chiave di release nei Secrets: APK firmato con la chiave di debug"
          fi

      - name: Compila APK (arm64, release)
        working-directory: android
        env:
          CONTROLLAMI_KEYSTORE_PASSWORD: ${{ secrets.CONTROLLAMI_KEYSTORE_PASSWORD }}
          CONTROLLAMI_KEY_ALIAS: ${{ secrets.CONTROLLAMI_KEY_ALIAS }}
          CONTROLLAMI_KEY_PASSWORD: ${{ secrets.CONTROLLAMI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Controlla la firma dell'APK
        if: env.CONTROLLAMI_KEYSTORE != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk | grep -i "certificate DN" | tee /dev/stderr | grep -q "ControllaMI"

      - name: Rinomina APK
        id: apk
        run: |
          mkdir -p out
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then NAME="ControllaMI-${GITHUB_REF_NAME}-arm64.apk"; else NAME="ControllaMI-${{ github.run_number }}-arm64.apk"; fi
          cp android/app/build/outputs/apk/release/*.apk "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ControllaMI-apk
          path: out/*.apk
          retention-days: 30

      - name: Pubblica la Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            APK per Android 64 bit (arm64) per la **YI Action Camera prima serie**.
            Scarica `${{ steps.apk.outputs.name }}` qui sotto e installalo sul telefono (consenti "installa app sconosciute").
